<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ibadan Life</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="auth-screen" class="screen">
  <div class="auth-card">
    <h1>🏙️ Ibadan Life</h1>
    <p class="tagline">Build a life in the city. Work, hustle, socialize, survive.</p>

    <div class="tabs">
      <button id="tab-login" class="tab active">Log In</button>
      <button id="tab-register" class="tab">New Life</button>
    </div>

    <form id="login-form" class="auth-form">
      <input type="text" id="login-username" placeholder="Username" required />
      <input type="password" id="login-password" placeholder="Password" required />
      <button type="submit">Log In</button>
    </form>

    <form id="register-form" class="auth-form hidden">
      <input type="text" id="reg-username" placeholder="Username" required />
      <input type="password" id="reg-password" placeholder="Password" required />
      <div class="profile-choice">
        <label class="profile-card">
          <input type="radio" name="profile" value="established" checked />
          <strong>Established</strong>
          <span>Start comfortable, with expectations.</span>
        </label>
        <label class="profile-card">
          <input type="radio" name="profile" value="hustler" />
          <strong>Hustler</strong>
          <span>Start small, with a loan already owed.</span>
        </label>
      </div>
      <button type="submit">Begin Life in Ibadan</button>
    </form>

    <p id="auth-error" class="error"></p>
  </div>
</div>

<div id="game-screen" class="screen hidden">
  <header class="topbar">
    <div class="player-id"><span id="player-avatar">🙂</span> <strong id="player-name"></strong></div>
    <div class="stats">
      <span title="Cash">💵 ₦<span id="stat-cash">0</span></span>
      <span title="Debt">📉 ₦<span id="stat-debt">0</span></span>
      <span title="Energy">⚡ <span id="stat-energy">0</span></span>
      <span title="Happiness">😊 <span id="stat-happiness">0</span></span>
      <span title="Reputation">⭐ <span id="stat-reputation">0</span></span>
    </div>
    <button id="logout-btn">Log Out</button>
  </header>

  <main class="layout">
    <section class="locations-panel">
      <h2>Ibadan</h2>
      <div id="locations-list"></div>
    </section>

    <section class="current-panel">
      <h2 id="current-location-name">—</h2>
      <p id="current-location-desc"></p>

      <div id="jobs-list" class="action-group"></div>

      <div class="action-row">
        <button id="rest-btn">😴 Rest (+30 energy)</button>
        <button id="socialize-btn">🗣️ Socialize</button>
      </div>

      <div class="debt-row hidden" id="debt-row">
        <input type="number" id="debt-amount" placeholder="Amount to pay off debt" min="1" />
        <button id="pay-debt-btn">Pay Debt</button>
      </div>

      <div class="who-here">
        <h3>Here now</h3>
        <ul id="presence-list"></ul>
      </div>
    </section>

    <section class="side-panel">
      <div class="chat-box">
        <h3>Local chat</h3>
        <div id="chat-log"></div>
        <form id="chat-form">
          <input type="text" id="chat-input" placeholder="Say something..." maxlength="300" />
          <button type="submit">Send</button>
        </form>
      </div>

      <div class="log-box">
        <h3>Your story</h3>
        <ul id="activity-log"></ul>
      </div>

      <div class="leaderboard-box">
        <h3>🏆 Richest in Ibadan</h3>
        <ol id="leaderboard-list"></ol>
      </div>
    </section>
  </main>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
